# /api/v3/custom_field_items/{id}
---
get:
  summary: Get a custom field hierarchy item
  operationId: get_custom_field_item
  description: |-
    Retrieves a single custom field item specified by its unique identifier.
  parameters:
    - name: id
      description: The custom field item's unique identifier
      in: path
      example: 42
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/hierarchy_item_read_model.yml'
          examples:
            'simple response':
              $ref: '../components/examples/hierarchy_item_response.yml'
    '401':
      description: Returned if no user is currently authenticated.
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:Unauthenticated
                message: You need to be authenticated to access this resource.
    '404':
      description: |-
        Returned if the custom field item does not exist or the user lacks permission to see it.

        The permission required to view the item depends on the custom field it belongs to.
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/error_response.yml'
          examples:
            response:
              value:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
