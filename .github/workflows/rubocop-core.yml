name: rubocop

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  rubocop:
    name: rubocop
    # Pinned: ubuntu-latest is Ubuntu 26, where ruby/setup-ruby only offers the newest 3.4.x
    # patch, so the exact 3.4.7 from .ruby-version (enforced by the Gemfile) cannot be installed.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
      - name: Run Rubocop
        uses: reviewdog/action-rubocop@v2
        with:
          github_token: ${{ secrets.github_token }}
          rubocop_version: gemfile
          rubocop_extensions: >
            rubocop-capybara:gemfile
            rubocop-factory_bot:gemfile
            rubocop-openproject:gemfile
            rubocop-performance:gemfile
            rubocop-rails:gemfile
            rubocop-rspec:gemfile
            rubocop-rspec_rails:gemfile
          reporter: github-pr-check
          only_changed: true
      - name: Install erb_lint
        run: gem install -N erb_lint erblint-github
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
      - name: Run erb-lint
        run: |
          erb_lint --lint-all --format compact | \
            reviewdog \
              -efm="%f:%l:%c: %m" \
              -name="erb_lint" \
              -reporter=github-pr-check \
              -filter-mode=added \
              -fail-on-error=true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
