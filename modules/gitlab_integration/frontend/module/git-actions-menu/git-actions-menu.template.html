<div class="git-actions-menu dropdown-relative dropdown -overflow-in-view dropdown-anchor-right">
  <h3 class="title">{{text.title}}</h3>

  @for (snippet of snippets; track snippet) {
    <div class="copy-wrapper op-form-field">
      <label class="op-form-field--label-wrap">
        <div class="op-form-field--label">{{ snippet.name }}</div>
        <div class="op-form-field--input">
          <input type="text" class="copy-content op-input" readonly="true" [value]="snippet.textToDisplay()">
          <button class="button copy-button"
            type="button"
            [attr.aria-label]="text.copyButtonHelpText"
            (click)="onCopyButtonClick(snippet)">
            <svg copy-icon size="small"></svg>
          </button>
          @if (showCopyResult && snippet.id === copiedSnippetId) {
            <div class="copy-result-message" [textContent]="lastCopyResult"></div>
          }
        </div>
      </label>
    </div>
  }

  @if (targetsLoaded) {
    <div class="create-branch-wrapper">
      @if (branchTargets.length === 0) {
        <p class="create-branch--empty" [textContent]="text.noTargets"></p>
      } @else if (branchTargets.length === 1) {
        <button class="button -primary"
          type="button"
          [disabled]="creatingBranch"
          (click)="createBranch(branchTargets[0])">
          <span class="button--text" [textContent]="text.createBranch"></span>
        </button>
      } @else {
        <div class="create-branch--label" [textContent]="text.createBranch"></div>
        <button class="button -primary create-branch--target"
          type="button"
          [disabled]="creatingBranch"
          (click)="createInAllTargets()">
          <span class="button--text" [textContent]="text.createBranchAll"></span>
        </button>
        @for (target of branchTargets; track target.id) {
          <button class="button create-branch--target"
            type="button"
            [disabled]="creatingBranch"
            (click)="createBranch(target)">
            <span class="button--text" [textContent]="target.name"></span>
          </button>
        }
      }
    </div>
  }
</div>
